<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hisense read-only recovery scan</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#f5f7fb;margin:0;padding:22px;line-height:1.5}main{max-width:650px;margin:auto}h1{font-size:25px}.panel{background:#1d293b;border-radius:14px;padding:16px;margin:16px 0}button{display:block;width:100%;padding:15px;border:0;border-radius:10px;background:#55d6a1;color:#081b16;font-weight:700;font-size:16px;margin-top:12px}.status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bdc8d8}</style></head><body><main><h1>Hisense read-only recovery scan</h1><p>This scan only reads browser storage. It does not write to the app, sign in, contact Firebase, or change sales.</p><div class="panel"><button id="scan">Scan this app storage</button><p id="status" class="status">Ready.</p></div><div class="panel" id="out" hidden><b>Scan results</b><p id="summary"></p><button id="save">Save read-only scan report</button><small>The report may contain sales details. Keep it private.</small></div></main><script>
const statusEl=document.getElementById('status'),out=document.getElementById('out'),summary=document.getElementById('summary');let report;
function reqToPromise(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('IndexedDB request failed'))})}
async function scanDb(name){let db;try{db=await reqToPromise(indexedDB.open(name));const result={name,stores:{}};for(const storeName of Array.from(db.objectStoreNames)){try{const tx=db.transaction(storeName,'readonly'),store=tx.objectStore(storeName);const keys=await reqToPromise(store.getAllKeys());const vals=await reqToPromise(store.getAll());result.stores[storeName]=keys.map((key,i)=>({key:String(key),value:vals[i]}));}catch(e){result.stores[storeName]={readError:String(e)}}}db.close();return result}catch(e){return {name,error:String(e)}}}
document.getElementById('scan').onclick=async()=>{statusEl.textContent='Scanning…';out.hidden=true;const local={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/sales|hisense/i.test(k)){const raw=localStorage.getItem(k);try{local[k]=JSON.parse(raw)}catch{local[k]=raw}}}}catch(e){local.error=String(e)}let dbs=[];try{if(indexedDB.databases){const list=await indexedDB.databases();for(const d of list){if(d.name)dbs.push(await scanDb(d.name))}}else{statusEl.textContent='This iPhone browser does not expose the database list. No database was opened or created.';}}catch(e){dbs=[{error:String(e)}]}report={createdAt:new Date().toISOString(),origin:location.origin,localStorage:local,indexedDB:dbs};let counts=[];for(const [k,v] of Object.entries(local)){if(Array.isArray(v))counts.push(k+': '+v.length+' records')}for(const db of dbs){for(const [s,items] of Object.entries(db.stores||{})){if(Array.isArray(items))counts.push(db.name+'/'+s+': '+items.length+' stored items')}}statusEl.textContent='Scan finished. No data was changed.\n'+(counts.length?counts.join('\n'):'No matching sales records were found in this browser context.')+'\nDatabases inspected: '+dbs.map(x=>x.name||'unknown').join(', ');summary.textContent='This report includes the names of the databases and any readable sales-related records found in this browser context.';out.hidden=false};document.getElementById('save').onclick=()=>{if(!report)return;const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.href=u;a.download='hisense-read-only-scan.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)};
</script></body></html>
