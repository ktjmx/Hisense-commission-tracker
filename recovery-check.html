<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hisense Sales Recovery Check</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#f5f7fb;margin:0;padding:22px;line-height:1.45}main{max-width:650px;margin:auto}h1{font-size:25px}p{color:#d3dbea}.panel{background:#1d293b;border-radius:14px;padding:16px;margin:16px 0}button{display:block;width:100%;box-sizing:border-box;padding:15px;border:0;border-radius:10px;background:#55d6a1;color:#081b16;font-weight:700;font-size:16px;text-align:center;margin-top:12px}small{color:#aebbd0}.status{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main>
<h1>Sales recovery check</h1><p>This page only <b>reads</b> saved sales on this device. It does not edit the app, Firebase, or any sales.</p>
<div class="panel"><b>Step 1</b><p>Tap the button below. It checks both of the app's browser storage locations.</p><button id="check">Check this device</button><div id="status" class="status"></div></div>
<div class="panel" id="result" hidden><b>Step 2</b><p id="summary"></p><button id="download" hidden>Download recovery copy</button><small>Keep this file safe. It may contain sales information.</small></div>
<script>
const KEY='hisenseSalesV2', DB='hisenseSalesProDB', STORE='sales';
const statusEl=document.getElementById('status'), result=document.getElementById('result'), summary=document.getElementById('summary'), download=document.getElementById('download');let exportData=null;
function readDb(){return new Promise(resolve=>{try{const req=indexedDB.open(DB);req.onerror=()=>resolve({error:String(req.error||'Could not open database')});req.onsuccess=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE)){db.close();resolve({missing:true});return}try{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(KEY);r.onsuccess=()=>{const value=r.result;db.close();resolve({value:Array.isArray(value)?value:null,found:Array.isArray(value)})};r.onerror=()=>{db.close();resolve({error:String(r.error||'Read failed')})}}catch(e){db.close();resolve({error:String(e)})}}}catch(e){resolve({error:String(e)})}})}
document.getElementById('check').onclick=async()=>{statusEl.textContent='Checking…';result.hidden=true;download.hidden=true;let local=null,localError=null;try{const raw=localStorage.getItem(KEY);local=raw?JSON.parse(raw):null}catch(e){localError=String(e)}const idb=await readDb();const count=x=>Array.isArray(x)?x.length:0;exportData={checkedAt:new Date().toISOString(),origin:location.origin,localStorage:{found:Array.isArray(local),records:local},indexedDB:{found:!!idb.found,records:idb.value,error:idb.error||null,missing:!!idb.missing}};const lc=count(local),ic=count(idb.value);statusEl.textContent='Check complete. Nothing has been changed.\nLocal browser copy: '+(Array.isArray(local)?lc+' records':'not found')+(localError?' (read issue: '+localError+')':'')+'\nIndexedDB copy: '+(idb.found?ic+' records':idb.missing?'not found':idb.error?'could not read':'not found')+'\n';summary.textContent='Found '+lc+' record(s) in browser storage and '+ic+' record(s) in the separate backup store. Download the copy before doing anything else.';result.hidden=false;download.hidden=!(lc||ic)};
download.onclick=()=>{if(!exportData)return;const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'}));a.href=url;a.download='hisense-sales-recovery-check.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};
</script></main></body></html>
